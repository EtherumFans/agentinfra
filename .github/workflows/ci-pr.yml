name: CI — PR (unit + frontend build)

# Fast gate for every PR. Unit tests + frontend typecheck/build + SDK
# typecheck. Integration / regression / e2e / product tests run on a
# separate workflow that schedules nightly and can be triggered
# manually.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  phi-security-release-gate:
    name: P1 PHI / Multi-tenant Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: icoder
          POSTGRES_PASSWORD: icoder_test
          POSTGRES_DB: icoder_phi_gate
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      P1_POSTGRES_ADMIN_DATABASE_URL: postgresql+psycopg://icoder:icoder_test@localhost:5432/icoder_phi_gate
      P1_POSTGRES_MIGRATION_DATABASE_URL: postgresql+psycopg://icoder_p1_migration:ci_migration_only@localhost:5432/icoder_phi_gate
      P1_POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://icoder_p1_app:ci_app_only@localhost:5432/icoder_phi_gate
      P1_POSTGRES_APP_DATABASE_URL: postgresql+asyncpg://icoder_p1_app:ci_app_only@localhost:5432/icoder_phi_gate
      DATABASE_URL: postgresql+asyncpg://icoder_p1_app:ci_app_only@localhost:5432/icoder_phi_gate
      ICODER_DATABASE_URL: postgresql+asyncpg://icoder_p1_app:ci_app_only@localhost:5432/icoder_phi_gate
      # Alembic prepares this disposable service database before pytest. Keep
      # the application test session on the app role and skip ORM DDL cleanup.
      ICODER_TEST_USE_PREMIGRATED_SCHEMA: "1"
      ICODER_POSTGRES_MIGRATION_ROLE: icoder_p1_migration
      ICODER_POSTGRES_APP_ROLE: icoder_p1_app
      ICODER_POSTGRES_MIGRATION_PASSWORD: ci_migration_only
      ICODER_POSTGRES_APP_PASSWORD: ci_app_only
      ICODER_PHI_KEY_PROVIDER: software_hsm
      ICODER_ALLOW_DEGRADED_NO_KEY: "0"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded network retry behavior
        run: |
          probe="$RUNNER_TEMP/icoder-network-retry-probe"
          rm -f "$probe"
          CI_NETWORK_RETRY_ATTEMPTS=2 \
          CI_NETWORK_RETRY_INITIAL_DELAY_SECONDS=0 \
            bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" \
            bash -c 'if [ ! -f "$1" ]; then touch "$1"; echo ETIMEDOUT >&2; exit 8; fi' \
            -- "$probe"
          rm -f "$probe"

          set +e
          CI_NETWORK_RETRY_ATTEMPTS=2 \
          CI_NETWORK_RETRY_INITIAL_DELAY_SECONDS=0 \
            bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" \
            bash -c 'echo lockfile-invalid >&2; exit 7'
          status=$?
          set -e
          test "$status" -eq 7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" python -m pip install -r requirements.txt
      - name: Generate job-scoped encryption and audit keys
        run: |
          python - <<'PY'
          import base64, json, os, secrets
          audit_key = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()
          checkpoint_key = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()
          archive_root = os.path.join(os.environ["RUNNER_TEMP"], "software-hsm-audit-worm")
          os.makedirs(archive_root, mode=0o700)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("ICODER_SOFT_HSM_BOOTSTRAP_KEY=" + base64.urlsafe_b64encode(secrets.token_bytes(32)).decode() + "\n")
              env.write("ICODER_SOFT_HSM_KEYSTORE_PATH=" + os.path.join(os.environ["RUNNER_TEMP"], "software-hsm.keys") + "\n")
              env.write("ICODER_SOFT_HSM_MIN_GENERATION=1\n")
              env.write("ICODER_SOFT_HSM_REQUIRE_ENCRYPTED_KEYSTORE=true\n")
              env.write("ICODER_SOFT_HSM_OPS_AUDIT_KEY=" + audit_key + "\n")
              env.write("ICODER_SOFT_HSM_OPS_AUDIT_KEY_ID=ci-soft-hsm-audit-v1\n")
              env.write("ICODER_SOFT_HSM_OPS_AUDIT_KEYS=" + json.dumps({"ci-soft-hsm-audit-v1": audit_key}, separators=(",", ":")) + "\n")
              env.write("ICODER_SOFT_HSM_OPS_AUDIT_PATH=" + os.path.join(os.environ["RUNNER_TEMP"], "software-hsm-ops.jsonl") + "\n")
              env.write("ICODER_SOFT_HSM_OPS_AUDIT_MIN_SEQUENCE=0\n")
              env.write("ICODER_SOFT_HSM_AUDIT_ARCHIVE_ADAPTER=local_worm_simulator\n")
              env.write("ICODER_SOFT_HSM_AUDIT_ARCHIVE_ROOT=" + archive_root + "\n")
              env.write("ICODER_SOFT_HSM_AUDIT_CHECKPOINT_KEY=" + checkpoint_key + "\n")
              env.write("ICODER_SOFT_HSM_AUDIT_CHECKPOINT_KEY_ID=ci-checkpoint-v1\n")
              env.write("ICODER_SOFT_HSM_AUDIT_RETENTION_DAYS=2555\n")
              env.write("ICODER_OPERATOR_IDENTITY=github-actions-phi-gate\n")
              env.write("ICODER_DEPLOYMENT_ENVIRONMENT=ci\n")
              env.write("ICODER_RELEASE_VERSION=" + os.environ.get("GITHUB_SHA", "unknown") + "\n")
              env.write("ICODER_AUDIT_SIGNING_KEY=" + secrets.token_urlsafe(64) + "\n")
              env.write("ICODER_AUDIT_SIGNING_KEY_ID=ci-audit-v1\n")
          PY
      - name: Create encrypted software-HSM key store
        env:
          # Exercise the optional add-on without changing the test job's
          # default-disabled product configuration.
          ICODER_IMMUTABLE_AUDIT_ARCHIVE_ENABLED: "true"
        run: >-
          python scripts/manage_soft_hsm_keystore.py create
          --path "$ICODER_SOFT_HSM_KEYSTORE_PATH"
          --key-id ci-kek-v1
          --change-ticket "CI-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Verify independent software-HSM operations audit
        env:
          ICODER_IMMUTABLE_AUDIT_ARCHIVE_ENABLED: "true"
        run: python scripts/verify_soft_hsm_ops_audit.py --minimum-sequence 2 --verify-archive
      - name: Reconcile optional immutable software-HSM audit archive
        env:
          ICODER_IMMUTABLE_AUDIT_ARCHIVE_ENABLED: "true"
        run: python scripts/reconcile_soft_hsm_ops_audit.py --max-pending-seconds 0
      - name: Export optional minimum-necessary immutable audit evidence
        env:
          ICODER_IMMUTABLE_AUDIT_ARCHIVE_ENABLED: "true"
        run: python scripts/export_soft_hsm_ops_audit.py --output "$RUNNER_TEMP/software-hsm-audit-evidence.json"
      - name: Rehearse software-HSM disaster recovery
        run: python scripts/rehearse_soft_hsm_disaster_recovery.py
      - name: Provision least-privilege database identities
        run: >-
          python scripts/provision_postgresql_roles.py provision
          --admin-url "$P1_POSTGRES_ADMIN_DATABASE_URL"
          --migration-role "$ICODER_POSTGRES_MIGRATION_ROLE"
          --app-role "$ICODER_POSTGRES_APP_ROLE"
      - name: Migrate with schema-owner identity
        env:
          DATABASE_URL: ${{ env.P1_POSTGRES_MIGRATION_DATABASE_URL }}
        run: python -m alembic upgrade head
      - name: Reject database-role privilege drift
        run: >-
          python scripts/provision_postgresql_roles.py verify
          --admin-url "$P1_POSTGRES_ADMIN_DATABASE_URL"
          --migration-role "$ICODER_POSTGRES_MIGRATION_ROLE"
          --app-role "$ICODER_POSTGRES_APP_ROLE"
      - name: PostgreSQL Wave 4 application-role contracts
        timeout-minutes: 12
        env:
          # Use the same offline PHI fallback as the compatibility workflow;
          # software-HSM operational material is tested by the gates below.
          ICODER_PHI_KEY_PROVIDER: legacy_fernet
          ICODER_ALLOW_DEGRADED_NO_KEY: "1"
          LLM_PROVIDER: mock
          ICODER_ALLOW_EXTERNAL_LLM: "false"
        run: >-
          python -m pytest
          tests/integration/icoder/context/test_db_schema.py
          tests/test_api/test_a1b_ae_r_4_local_expert_completion.py
          -m postgresql_compat
          -o asyncio_default_test_loop_scope=session
          --junitxml=../artifacts/postgresql-wave4-app-role.xml
          -v --tb=short
      - name: Upload PostgreSQL Wave 4 application-role evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-wave4-app-role-evidence
          path: artifacts/postgresql-wave4-app-role.xml
          if-no-files-found: error
          retention-days: 14
      - name: Run PHI, RLS, migration, rotation and artifact gates
        run: |
          # The operational rehearsal above uses job-scoped one-time HSM
          # material. Tests construct their own keyrings and must not inherit
          # those values, while retaining the least-privilege database URLs.
          # Keep the cleanup in a subshell so the cloud-startup proof below
          # still exercises the real, job-scoped software-HSM configuration.
          (
            unset ICODER_PHI_KEY_PROVIDER ICODER_IMMUTABLE_AUDIT_ARCHIVE_ENABLED
            for variable in $(compgen -v ICODER_SOFT_HSM_); do
              unset "$variable"
            done
            python -m pytest -q \
            tests/test_api/test_phi_envelope_revision_072.py \
            tests/test_api/test_verified_membership_revision_073.py \
            tests/unit/app/services/test_phi_envelope_types.py \
            tests/unit/app/services/test_soft_hsm_keystore.py \
            tests/unit/app/services/test_soft_hsm_ops_audit.py \
            tests/unit/app/services/test_soft_hsm_audit_archive.py \
            tests/unit/app/services/test_soft_hsm_s3_audit_archive.py \
            tests/unit/app/services/test_soft_hsm_audit_reconcile.py \
            tests/unit/app/services/test_phi_artifact_scanner.py \
            tests/integration/test_postgresql_role_provisioning.py \
            tests/integration/test_verified_membership_postgres.py \
            tests/integration/test_phi_envelope_postgres.py \
            tests/integration/test_phi_hsm_rotation_postgres.py \
            tests/integration/test_p1_postgres_rls_attack.py
          )
          python -m pytest -q tests/integration/test_cloud_startup_postgres.py

  frontend:
    name: Frontend (TS + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" npm ci
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" npm audit --audit-level=high
      - name: Frontend unit tests
        run: npm test -- --run --reporter=default --reporter=junit --outputFile=test-results/frontend-unit.xml
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Upload frontend unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-evidence
          path: frontend/test-results/frontend-unit.xml
          if-no-files-found: error
          retention-days: 14

  backend-unit:
    name: Backend (Unit)
    runs-on: ubuntu-latest
    env:
      ICODER_DATA_ASSET_DIR: ${{ github.workspace }}/backend/data/code_dicts/assets
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" python -m pip install -r requirements.txt
      - name: Install isolated ML unit-test dependencies
        run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" python -m pip install -r requirements-ml.txt jsonschema==4.25.1
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" python -m pip install pip-audit
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" python -m pip_audit -r requirements-api.txt
      # Phase A A5: unit tests only on PR. Integration/regression/e2e
      # moved to ci-integration.yml.
      - name: Unit tests (excludes integration / e2e / regression / e2e_product)
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/integration \
            --ignore=tests/e2e \
            --ignore=tests/e2e_product \
            --ignore=tests/regression \
            -k "not test_mcp_client_pubmed_search"

  sdk-js:
    name: JS SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/icoder-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: packages/icoder-sdk/package-lock.json
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" npm ci
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" npm audit --audit-level=high
      - run: npm test

  sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/icoder-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" python -m pip install pytest pytest-asyncio==1.4.0 build httpx pydantic
      - run: python -m pytest -q
      - run: python -m build --wheel --outdir artifacts/ci

  sdk-dotnet:
    name: .NET SDK (netstandard2.0 + net8.0 + net10.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/icoder-dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test native runtime targets
        run: dotnet test tests/Icoder.Sdk.Tests/Icoder.Sdk.Tests.csproj -c Release
      - name: Build oldest supported consumers
        run: |
          dotnet build tests/Icoder.Sdk.NetStandard20Consumer/Icoder.Sdk.NetStandard20Consumer.csproj -c Release
          dotnet build tests/Icoder.Sdk.Net462Consumer/Icoder.Sdk.Net462Consumer.csproj -c Release
      - name: Pack all supported framework assets
        run: dotnet pack src/Icoder.Sdk/Icoder.Sdk.csproj -c Release --no-restore -o artifacts/ci
      - name: Verify NuGet framework assets
        run: |
          package="$(find artifacts/ci -maxdepth 1 -name 'iCoDer.Sdk.*.nupkg' ! -name '*.snupkg' -print -quit)"
          test -n "$package"
          unzip -l "$package" | grep -F 'lib/netstandard2.0/Icoder.Sdk.dll'
          unzip -l "$package" | grep -F 'lib/net8.0/Icoder.Sdk.dll'
          unzip -l "$package" | grep -F 'lib/net10.0/Icoder.Sdk.dll'
      - uses: actions/upload-artifact@v4
        with:
          name: icoder-dotnet-packages
          path: packages/icoder-dotnet/artifacts/ci/*.*nupkg
          if-no-files-found: error
          retention-days: 14

  contracts-deployment:
    name: OpenAPI + Deployment Preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" python -m pip install -r requirements.txt
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" python -m pip install pip-audit
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" python -m pip_audit -r requirements-api.txt
      - name: Cross-language release version contract
        run: |
          python ../scripts/release/validate_release_candidate.py \
            --output ../reports/release-candidate/ci-version-manifest.json
          python -m pytest -q ../tests/test_release_candidate_validator.py ../tests/test_ci_evidence.py
      - run: python scripts/export_openapi.py --check
      - run: python scripts/corti_parity/validate_deployment_candidate.py --output-dir ../reports/deployment/ci-preflight
      - run: python -m pytest -q tests/unit/app/test_config_fail_closed.py tests/unit/corti_parity/test_deployment_candidate_preflight.py

  sdk-web:
    name: Web Components
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/icoder-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" npm install
      - run: npx tsc --noEmit
