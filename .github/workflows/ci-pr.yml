name: CI — PR (unit + frontend build)

# Fast gate for every PR. Unit tests + frontend typecheck/build + SDK
# typecheck. Integration / regression / e2e / product tests run on a
# separate workflow that schedules nightly and can be triggered
# manually.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (TS + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build

  backend-unit:
    name: Backend (Unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Phase A A5: unit tests only on PR. Integration/regression/e2e
      # moved to ci-integration.yml.
      - name: Unit tests (excludes integration / e2e / regression / e2e_product)
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/integration \
            --ignore=tests/e2e \
            --ignore=tests/e2e_product \
            --ignore=tests/regression \
            -k "not test_mcp_client_pubmed_search"

  sdk-js:
    name: JS SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/icoder-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit

  sdk-web:
    name: Web Components
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/icoder-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit