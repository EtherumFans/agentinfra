name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start docker compose (local-dev only)
        run: |
          # The bind mount is synthetic local/E2E state. Create it before
          # Docker so the non-root backend user can populate fallback data.
          install -d -m 0777 .data/icoder
          docker compose -f docker-compose.local-dev.yml up -d --build
          # Wait for backend healthcheck
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/api/health > /dev/null
          # Wait for frontend
          for i in $(seq 1 15); do
            if curl -sf http://localhost/ > /dev/null 2>&1; then
              echo "Frontend ready after ${i}s"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost/ > /dev/null
        env:
          ICODER_CREDENTIAL_LLM: ${{ secrets.ICODER_CREDENTIAL_LLM || '' }}

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Capture compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.local-dev.yml logs --no-color > compose-e2e.log

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-e2e-logs
          path: compose-e2e.log
          retention-days: 7

      - name: Docker compose down
        if: always()
        run: docker compose -f docker-compose.local-dev.yml down -v
