name: Release Candidate (build-only, no registry publish)

on:
  workflow_dispatch:
  push:
    tags:
      - "rc-v*"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-contract:
    name: SDK version contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate cross-language release version
        shell: bash
        run: |
          command=(python scripts/release/validate_release_candidate.py \
            --output reports/release-candidate/version-manifest.json)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            command+=(--expected-version "${GITHUB_REF_NAME#rc-v}")
          fi
          "${command[@]}"
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" python -m pip install pytest
      - name: Test release validator
        run: python -m pytest -q tests/test_release_candidate_validator.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-version-contract
          path: reports/release-candidate/version-manifest.json
          if-no-files-found: error
          retention-days: 30

  javascript-sdk:
    name: JavaScript SDK package
    needs: version-contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/icoder-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: packages/icoder-sdk/package-lock.json
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" npm ci
      - run: npm test
      - run: mkdir -p "${{ runner.temp }}/release" && npm pack --pack-destination "${{ runner.temp }}/release"
      - uses: actions/upload-artifact@v4
        with:
          name: release-javascript-sdk
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
          retention-days: 30

  browser-packages:
    name: Browser packages
    needs: version-contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - icoder-embedded
          - icoder-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" npm ci
        working-directory: packages/${{ matrix.package }}
      - run: npm run build
        working-directory: packages/${{ matrix.package }}
      - run: mkdir -p "${{ runner.temp }}/release" && npm pack --pack-destination "${{ runner.temp }}/release"
        working-directory: packages/${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.package }}
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
          retention-days: 30

  python-sdk:
    name: Python SDK package
    needs: version-contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/icoder-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" python -m pip install --upgrade build pytest httpx pydantic
      - run: python -m pytest -q
      - run: python -m build --wheel --sdist --outdir "${{ runner.temp }}/release"
      - uses: actions/upload-artifact@v4
        with:
          name: release-python-sdk
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 30

  dotnet-sdk:
    name: .NET SDK package
    needs: version-contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/icoder-dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test tests/Icoder.Sdk.Tests/Icoder.Sdk.Tests.csproj -c Release
      - name: Build oldest supported consumers
        run: |
          dotnet build tests/Icoder.Sdk.NetStandard20Consumer/Icoder.Sdk.NetStandard20Consumer.csproj -c Release
          dotnet build tests/Icoder.Sdk.Net462Consumer/Icoder.Sdk.Net462Consumer.csproj -c Release
      - run: dotnet pack src/Icoder.Sdk/Icoder.Sdk.csproj -c Release --no-restore -o "${{ runner.temp }}/release"
      - name: Verify all target-framework assets
        run: |
          package="$(find "${{ runner.temp }}/release" -maxdepth 1 -name 'iCoDer.Sdk.*.nupkg' ! -name '*.snupkg' -print -quit)"
          test -n "$package"
          unzip -l "$package" | grep -F 'lib/netstandard2.0/Icoder.Sdk.dll'
          unzip -l "$package" | grep -F 'lib/net8.0/Icoder.Sdk.dll'
          unzip -l "$package" | grep -F 'lib/net10.0/Icoder.Sdk.dll'
      - uses: actions/upload-artifact@v4
        with:
          name: release-dotnet-sdk
          path: ${{ runner.temp }}/release/*.*nupkg
          if-no-files-found: error
          retention-days: 30

  frontend:
    name: Console production bundle
    needs: version-contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" npm ci
      - run: npm test -- --run
      - run: npm run build
      - name: Archive the exact production bundle
        run: tar -czf "${{ runner.temp }}/icoder-console-${{ github.sha }}.tgz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: release-console
          path: ${{ runner.temp }}/icoder-console-*.tgz
          if-no-files-found: error
          retention-days: 30

  platform-gates:
    name: Agent Hub, contracts, and deployment gates
    needs: version-contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: mock
      ICODER_ALLOW_EXTERNAL_LLM: "false"
      ICODER_DISABLE_NATIVE_MEDCODER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry_network_command.sh" python -m pip install -r requirements.txt
      - name: Validate public contracts and 26 visible Agents
        run: |
          python scripts/export_openapi.py --check
          python scripts/corti_parity/build_agent_hub_runtime_matrix.py \
            --output-dir ../reports/release-candidate/runtime-matrix \
            --assert-visible-ready
          python scripts/corti_parity/validate_deployment_candidate.py \
            --output-dir ../reports/release-candidate/deployment-preflight
      - name: Run release safety regression
        run: >-
          python -m pytest -q
          tests/unit/icoder_runtime/test_agent_hub_runtime_matrix.py
          tests/unit/icoder_runtime/test_visible_agent_safety_properties.py
          tests/unit/app/test_config_fail_closed.py
          tests/unit/corti_parity/test_deployment_candidate_preflight.py
          tests/integration/icoder/test_medcoder_remote_http_e2e.py
          tests/integration/icoder/test_external_registry_remote_http_e2e.py
          tests/integration/icoder/test_memory_semantic_remote_http_e2e.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-platform-gates
          path: reports/release-candidate
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble reviewable release candidate
    needs:
      - javascript-sdk
      - browser-packages
      - python-sdk
      - dotnet-sdk
      - frontend
      - platform-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-candidate/artifacts
          merge-multiple: true
      - name: Generate SHA-256 release manifest and enforce expected outputs
        run: |
          python scripts/release/validate_release_candidate.py \
            --artifact-dir release-candidate/artifacts \
            --output release-candidate/RELEASE_MANIFEST.json \
            --require 'icoder-sdk-*.tgz' \
            --require 'icoder-embedded-*.tgz' \
            --require 'icoder-web-*.tgz' \
            --require 'icoder_sdk-*.whl' \
            --require 'icoder_sdk-*.tar.gz' \
            --require 'iCoDer.Sdk.*.nupkg' \
            --require 'iCoDer.Sdk.*.snupkg' \
            --require 'icoder-console-*.tgz'
      - uses: actions/upload-artifact@v4
        with:
          name: icoder-release-candidate-${{ github.sha }}
          path: release-candidate
          if-no-files-found: error
          retention-days: 30
