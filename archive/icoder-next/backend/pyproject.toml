[project]
name = "icoder-next"
version = "0.1.0"
description = "iCoDer-next — 医疗收入合规 AI Runtime (端到端薄竖切)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["icoder*"]
