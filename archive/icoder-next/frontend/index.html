<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f9d8f'/><text x='16' y='22' font-size='16' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'>iC</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iCoDer · 医疗收入合规 AI</title>
    <!-- FOUC guard: apply the saved/OS theme before first paint so dark mode never flashes. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("icoder-theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var r = document.documentElement;
          if (t === "dark") r.classList.add("dark");
          r.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <!-- Registers the framework-agnostic <icoder-embedded> custom element (served from public/). -->
    <script src="/icoder-embedded.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
