<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iCoDer · 病案首页编码审核 (embed demo)</title>
  <style>
    :root { --teal:#0f9d8f; --ink:#1d2430; --line:#e3e8ee; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
           color:var(--ink); background:#f4f6f9; }
    header { background:#fff; border-bottom:1px solid var(--line); padding:14px 22px;
             display:flex; align-items:center; gap:12px; }
    header .logo { width:26px;height:26px;border-radius:7px;background:var(--teal);
             color:#fff;display:grid;place-items:center;font-weight:700; }
    header h1 { font-size:16px; margin:0; }
    header .tag { font-size:12px; color:#5b6b80; background:#eef2f7; padding:2px 8px; border-radius:999px; }
    header .spacer { flex:1; }
    main { max-width:1180px; margin:18px auto; padding:0 18px; display:grid;
           grid-template-columns: 360px 1fr; gap:18px; }
    @media (max-width:980px){ main { grid-template-columns:1fr; } }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
    .card h2 { font-size:13px; margin:0 0 10px; color:#48566a; letter-spacing:.02em; }
    label { font-size:12px; color:#5b6b80; display:block; margin:10px 0 4px; }
    textarea { width:100%; height:190px; resize:vertical; font:13px/1.7 "IBM Plex Mono",ui-monospace,monospace;
               border:1px solid var(--line); border-radius:8px; padding:10px; }
    select, .btn { font:inherit; }
    select { width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
    .btn { cursor:pointer; border:1px solid var(--teal); background:var(--teal); color:#fff;
           border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; margin-top:12px; width:100%; }
    .btn.secondary { background:#fff; color:var(--teal); }
    .hint { font-size:11px; color:#90a0b3; margin-top:8px; line-height:1.5; }
    .console { font:12px/1.6 "IBM Plex Mono",ui-monospace,monospace; background:#0f1722; color:#cfe9e4;
               border-radius:8px; padding:10px; height:150px; overflow:auto; margin-top:8px; }
    .console .t { color:#7fd7c9; } .console .muted { color:#6b7c8c; }
    .embed-tabs { display:flex; gap:6px; margin-bottom:8px; }
    .embed-tabs button { font:inherit; font-size:12px; cursor:pointer; border:1px solid var(--line);
           background:#fff; border-radius:7px; padding:4px 10px; }
    .embed-tabs button.active { background:var(--teal); color:#fff; border-color:var(--teal); }
    pre.snippet { background:#0f1722; color:#cfe9e4; border-radius:8px; padding:12px; overflow:auto;
           font:12px/1.6 "IBM Plex Mono",ui-monospace,monospace; margin:0; }
  </style>
</head>
<body>
  <header>
    <div class="logo">iC</div>
    <h1>iCoDer · 病案首页编码审核</h1>
    <span class="tag">on-prem · 数据不出院</span>
    <div class="spacer"></div>
    <span class="tag" id="who">host owns auth</span>
  </header>

  <main>
    <!-- The HOST app owns branding + auth + input. The widget only renders results. -->
    <section class="card">
      <h2>宿主应用（持有鉴权与输入）</h2>

      <label>登录角色（host 注入令牌，组件不持凭据）</label>
      <select id="role">
        <option value="demo:coder">coder（可人工复核）</option>
        <option value="demo:reviewer">reviewer（仅查看，复核 403）</option>
        <option value="demo:admin">admin</option>
      </select>

      <label>病历文本（去标识化前）</label>
      <textarea id="text">主要诊断：慢性心力衰竭，心功能Ⅲ级。
其他诊断：高血压病，2型糖尿病，慢性肾脏病，心房颤动。
手术操作：胃镜检查及活检。
影像学：X线提示骨质疏松伴病理性骨折。
患者姓名：张三，住院号：ZY20260613，联系电话：13800001111。</textarea>

      <button class="btn" id="run">运行编码审核</button>
      <div class="hint">流程：configureSession(token) → configure(agent) → run(text)。
        PHI 在服务端脱敏，组件只渲染去标识化文本。</div>

      <h2 style="margin-top:18px;">embedded-event 事件总线</h2>
      <div class="console" id="console"><span class="muted">事件将在此显示…</span></div>
    </section>

    <!-- The embeddable widget. base-url empty = same-origin in-hospital server. -->
    <section class="card">
      <h2>嵌入组件 &lt;icoder-embedded&gt;</h2>
      <icoder-embedded id="widget" base-url=""></icoder-embedded>

      <h2 style="margin-top:18px;">复制嵌入代码</h2>
      <div class="embed-tabs">
        <button data-fmt="html" class="active">HTML</button>
        <button data-fmt="react">React</button>
        <button data-fmt="json">Agent Card (JSON)</button>
      </div>
      <pre class="snippet" id="snippet"></pre>
    </section>
  </main>

  <script src="/icoder-embedded.js"></script>
  <script>
    const widget = document.getElementById("widget");
    const consoleEl = document.getElementById("console");
    const roleEl = document.getElementById("role");
    const whoEl = document.getElementById("who");
    const AGENT = "icoder/homepage-coding-review-agent";

    function log(type, payload) {
      const line = document.createElement("div");
      line.innerHTML = `<span class="t">${type}</span> <span class="muted">${
        payload ? JSON.stringify(payload) : ""}</span>`;
      consoleEl.prepend(line);
    }

    // Host wires the event bus.
    widget.addEventListener("embedded-event", (e) => log(e.detail.type, e.detail.payload));

    function session() {
      const token = roleEl.value;
      whoEl.textContent = `token: ${token}`;
      widget.configureSession({ token });            // auth — host-injected, stateless
      widget.configure({ agentId: AGENT, codingSystem: "ICD-10-CN" });
    }
    roleEl.addEventListener("change", session);

    document.getElementById("run").addEventListener("click", () => {
      session();
      widget.run(document.getElementById("text").value);
    });

    // Establish session on load (ready -> auth -> configure).
    session();

    // --- copy-embed snippets (HTML / React / JSON) ---
    const SNIPPETS = {
      html: `<script src="https://hospital.internal/icoder-embedded.js"><\/script>
<icoder-embedded id="w" base-url="https://hospital.internal"></icoder-embedded>
<script>
  const w = document.getElementById('w');
  w.configureSession({ token: HOST_ISSUED_TOKEN });   // host owns auth
  w.configure({ agentId: '${AGENT}', codingSystem: 'ICD-10-CN' });
  w.addEventListener('embedded-event', e => handle(e.detail));
  w.run(deidentifiedOrRawClinicalText);
<\/script>`,
      react: `import { useEffect, useRef } from 'react';
import 'icoder-embedded';   // registers the custom element

export function CodingReview({ token, text }) {
  const ref = useRef(null);
  useEffect(() => {
    const w = ref.current;
    w.configureSession({ token });
    w.configure({ agentId: '${AGENT}', codingSystem: 'ICD-10-CN' });
    const on = e => console.log(e.detail.type, e.detail.payload);
    w.addEventListener('embedded-event', on);
    return () => w.removeEventListener('embedded-event', on);
  }, [token]);
  return <icoder-embedded ref={ref} base-url="https://hospital.internal" />;
}`,
      json: `// GET /agents/${AGENT}/card  (A2A-style discovery)
{
  "schemaVersion": "a2a/0.1",
  "id": "${AGENT}",
  "capabilities": { "humanInTheLoop": true, "evidenceLinked": true },
  "x-icoder": {
    "deployment": "on-prem",
    "data_residency": "in-hospital",
    "coding_systems": ["ICD-10-CN", "ICD-9-CM-3"],
    "production_writeback_blocked": true
  }
}`,
    };
    const snippetEl = document.getElementById("snippet");
    function showSnippet(fmt) { snippetEl.textContent = SNIPPETS[fmt]; }
    document.querySelectorAll(".embed-tabs button").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".embed-tabs button").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        showSnippet(b.dataset.fmt);
      });
    });
    showSnippet("html");
  </script>
</body>
</html>
