<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iCoDer Agent Marketplace</title>
<style>
:root{--bg:#fafbfc;--card:#fff;--border:#e1e4e8;--text:#24292e;--muted:#586069;--primary:#0366d6;--green:#28a745;--radius:6px;--shadow:0 1px 3px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);max-width:960px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:16px}
header h1{font-size:20px;font-weight:600}
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px}
.search-bar select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--card)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab-btn{padding:4px 12px;font-size:12px;border:1px solid var(--border);border-radius:12px;cursor:pointer;background:var(--card);color:var(--muted)}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.stats{display:flex;gap:16px;margin-bottom:16px;font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.card-icon{font-size:24px;flex-shrink:0}
.card-body{flex:1;min-width:0}
.card-body h3{font-size:15px;margin-bottom:4px}
.card-body .meta{font-size:12px;color:var(--muted);margin-bottom:4px}
.card-body .desc{font-size:13px;color:var(--text);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-body .tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:11px;padding:1px 6px;background:#f1f8ff;color:var(--primary);border-radius:3px}
.tag-community{background:#fff3cd;color:#856404}
.tag-certified{background:#d4edda;color:#155724}
.card-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;background:var(--card);color:var(--text);text-decoration:none}
.btn:hover{background:#f3f4f6}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:#0256cc}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--radius);padding:24px;max-width:500px;width:90%}
.modal h2{font-size:16px;margin-bottom:12px}
.modal label{display:block;font-size:13px;margin:8px 0 4px}
.modal input,.modal textarea{width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px}
.modal textarea{min-height:60px;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.error{background:#ffeef0;color:#d73a49;padding:8px 12px;border-radius:var(--radius);margin-top:8px;font-size:13px}
.success{background:#dcffe4;color:#28a745;padding:8px 12px;border-radius:var(--radius);margin-top:8px;font-size:13px}
.empty{text-align:center;padding:64px 0;color:var(--muted)}
</style>
</head>
<body>

<header>
  <div><h1>iCoDer Agent Marketplace</h1></div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-primary" onclick="openPublishModal()">Publish Agent</button>
  </div>
</header>

<div class="stats" id="stats"></div>

<div class="search-bar">
  <input type="text" id="search" placeholder="Search agents..." oninput="loadPackages()">
  <select id="category" onchange="loadPackages()">
    <option value="">All Categories</option>
  </select>
  <select id="sort" onchange="loadPackages()">
    <option value="newest">Newest</option>
    <option value="downloads">Most Downloaded</option>
    <option value="name">Name</option>
  </select>
</div>

<div class="tabs" id="type-tabs">
  <button class="tab-btn active" onclick="setType('all')">All</button>
  <button class="tab-btn" onclick="setType('certified')">Certified</button>
  <button class="tab-btn" onclick="setType('community')">Community</button>
</div>

<div id="packages-list"></div>
<div class="empty" id="packages-empty">No agents published yet. Be the first!</div>

<!-- Publish Modal -->
<div class="modal-overlay" id="publish-modal">
  <div class="modal">
    <h2>Publish Agent</h2>
    <label>Agent Package (.icoder-agent file)</label>
    <input type="file" id="publish-file" accept=".icoder-agent,.json">
    <label>Publisher Name</label>
    <input type="text" id="publisher-name" placeholder="Your name or company">
    <label>Publisher Email</label>
    <input type="email" id="publisher-email" placeholder="your@email.com">
    <div class="modal-actions">
      <button class="btn" onclick="closePublishModal()">Cancel</button>
      <button class="btn btn-primary" onclick="publishAgent()">Publish</button>
    </div>
    <div id="publish-msg"></div>
  </div>
</div>

<script>
const API = '';

let currentType = 'all';

function setType(t) { currentType = t; document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().includes(t))); loadPackages(); }

async function api(path, opts = {}) {
  const res = await fetch(API + path, { headers: { 'Content-Type': 'application/json', ...opts.headers }, ...opts });
  if (!res.ok) { const e = await res.json().catch(()=>({detail:res.statusText})); throw new Error(typeof e.detail==='string'?e.detail:JSON.stringify(e.detail)); }
  return res.json();
}

async function loadStats() {
  try {
    const s = await api('/api/stats');
    document.getElementById('stats').innerHTML = `<span>${s.total_packages} packages</span><span>${s.total_downloads} downloads</span><span>${s.categories} categories</span>`;
  } catch(e) {}
}

async function loadCategories() {
  try {
    const d = await api('/api/packages/categories');
    const sel = document.getElementById('category');
    d.categories.forEach(c => { const o = document.createElement('option'); o.value = c.name; o.textContent = `${c.name} (${c.count})`; sel.appendChild(o); });
  } catch(e) {}
}

async function loadPackages() {
  const search = document.getElementById('search').value;
  const category = document.getElementById('category').value;
  const sort = document.getElementById('sort').value;
  try {
    const d = await api(`/api/packages?search=${encodeURIComponent(search)}&category=${category}&sort=${sort}`);
    const list = document.getElementById('packages-list');
    const empty = document.getElementById('packages-empty');
    if (d.packages.length === 0) { list.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    list.innerHTML = d.packages.map(p => `
      <div class="card">
        <div class="card-icon">${p.icon === 'Shield' ? '\u{1f6e1}' : p.icon === 'Stethoscope' ? '\u{1fa7a}' : '\u{1f4cb}'}</div>
        <div class="card-body">
          <h3>${esc(p.name)} <span style="font-weight:400;font-size:12px;color:var(--muted)">v${esc(p.version)}</span></h3>
          <div class="meta">${esc(p.category)} · ${p.expert_count} experts · ${p.tool_count} tools · by ${esc(p.publisher_name)} · ${p.downloads} downloads</div>
          <div class="desc">${esc(p.description)}</div>
          <div class="tags">
            <span class="tag">${esc(p.category)}</span>
          </div>
          <div class="card-actions">
            <a href="${API}/api/packages/${p.id}/download" class="btn btn-primary" download>Download</a>
          </div>
        </div>
      </div>
    `).join('');
  } catch(e) { console.error(e); }
}

function openPublishModal() { document.getElementById('publish-modal').classList.add('open'); }
function closePublishModal() { document.getElementById('publish-modal').classList.remove('open'); document.getElementById('publish-msg').innerHTML = ''; }

async function publishAgent() {
  const file = document.getElementById('publish-file').files[0];
  if (!file) { document.getElementById('publish-msg').innerHTML = '<div class="error">Select a file</div>'; return; }
  const name = document.getElementById('publisher-name').value;
  const email = document.getElementById('publisher-email').value;
  if (!name || !email) { document.getElementById('publish-msg').innerHTML = '<div class="error">Enter name and email</div>'; return; }
  try {
    const text = await file.text();
    const pack = JSON.parse(text);
    await api('/api/packages', { method: 'POST', body: JSON.stringify({ pack, publisher_name: name, publisher_email: email }) });
    document.getElementById('publish-msg').innerHTML = '<div class="success">Published!</div>';
    setTimeout(() => { closePublishModal(); loadPackages(); loadStats(); loadCategories(); }, 1000);
  } catch(e) { document.getElementById('publish-msg').innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

loadStats(); loadCategories(); loadPackages();
</script>
</body>
</html>
