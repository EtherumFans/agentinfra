<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iCoDer Embedded — Corti-compatible Method-based API Demo (2.0)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background: #fafaf8; color: #1d1d1f; }
    h1 { font-size: 22px; }
    h2 { font-size: 16px; margin: 24px 0 8px; }
    .notes { font-size: 12px; color: #6e6e73; margin-bottom: 16px; }
    .controls { display: flex; gap: 8px; margin: 16px 0; }
    .controls button { padding: 6px 12px; font-size: 12px; border: 1px solid #d2d2d7; background: #fff; border-radius: 6px; cursor: pointer; }
    .controls button:hover { background: #007aff; color: #fff; border-color: #007aff; }
    #icoder-assistant { height: 500px; width: 100%; max-width: 480px; }
    pre#log { background: #1c1c1e; color: #f5f5f7; padding: 12px; border-radius: 8px; font-size: 11px; overflow-x: auto; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>iCoDer Embedded 2.0 — Corti-compatible API</h1>
  <p class="notes">Phase 5 A4 demo. Uses the new method-based API: <code>auth() → configureSession() → configure() → show()</code>. Unified <code>embedded-event</code> listener.</p>

  <div class="controls">
    <button id="btn-init">Initialize Widget</button>
    <button id="btn-legacy" title="Tests 1.0 attribute-based backward compat">Test 1.0 Attribute Compat</button>
  </div>

  <icoder-embedded id="icoder-assistant" baseURL="http://localhost:8000"></icoder-embedded>

  <h2>Event Log</h2>
  <pre id="log"></pre>

  <script type="module">
    import '../dist/icoder-assistant.js';
    // If using npm: import '@icoder/embedded';

    const logEl = document.getElementById('log');
    function log(name, payload) {
      const line = `[${new Date().toISOString()}] ${name}: ${JSON.stringify(payload)}`;
      logEl.textContent = line + '\n' + logEl.textContent;
    }

    // Unified embedded-event listener (Corti-compatible envelope {name, payload})
    document.getElementById('icoder-assistant').addEventListener('embedded-event', (e) => {
      const { name, payload } = e.detail;
      log(name, payload);
      if (name === 'account.creditsConsumed') {
        log('  → cost update shown in TopBar would be: ¥' + payload.amount.toFixed(6));
      }
    });

    document.getElementById('icoder-assistant').addEventListener('ready', async () => {
      log('ready', {});
    });

    document.getElementById('btn-init').addEventListener('click', async () => {
      const a = document.getElementById('icoder-assistant');
      // 1. auth
      await a.auth({
        access_token: 'dev-bypass-token',
        token_type: 'bearer',
        mode: 'stateless',
      });
      log('auth', { status: 'ok (stateless)' });

      // 2. configureSession
      await a.configureSession({
        defaultTemplateKey: 'icoder/medical-coding-agent',
        defaultLanguage: 'zh-CN',
        defaultOutputLanguage: 'zh-CN',
        // iCoDer ADVANTAGE: explicit patient context (Corti uses only templateKey)
        patientId: 'P-2026-001',
        name: '张三',
        encounterId: 'E-2026-0701',
      });
      log('configureSession', { templateKey: 'icoder/medical-coding-agent' });

      // 3. configure features + locale
      await a.configure({
        features: { aiChat: true, documentFeedback: true, virtualMode: false },
        locale: { dictationLanguage: 'zh-CN', interfaceLanguage: 'zh-CN' },
      });
      log('configure', { features: 'aiChat=true, locale=zh-CN' });

      // 4. show
      await a.show();
      log('show', { visible: true });
    });

    document.getElementById('btn-legacy').addEventListener('click', () => {
      // Test backward compat: 1.0 attribute-based config still works (with console.warn)
      const oldTag = document.createElement('icoder-assistant');
      oldTag.setAttribute('base-url', 'http://localhost:8000');
      oldTag.setAttribute('access-token', 'test-token');
      oldTag.setAttribute('agent-ref', 'icoder/medical-coding-agent');
      oldTag.style.height = '200px';
      oldTag.style.marginTop = '12px';
      document.body.appendChild(oldTag);
      log('legacy-tag-installed', { tag: 'icoder-assistant', mode: 'attribute-based (deprecated)' });
    });
  </script>
</body>
</html>
