[project]
name = "icoder-sdk"
version = "1.0.0b50"
description = "iCoDer Python SDK for a medical AI agent platform serving Chinese hospitals"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["httpx>=0.27", "pydantic>=2.0"]
keywords = ["icoder", "medical", "coding", "icd-10", "ai", "healthcare"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["icoder_sdk*"]
