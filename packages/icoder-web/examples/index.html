<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iCoDer Web Components — Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans SC', sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #fafaf8; }
    h2 { font-size: 18px; margin: 24px 0 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  </style>
</head>
<body>
  <h1>iCoDer Web Components</h1>
  <p>Embeddable medical AI widgets — zero dependencies.</p>

  <div class="grid">
    <div>
      <h2>&lt;icoder-stt&gt;</h2>
      <icoder-stt language="zh-CN" placeholder="点击麦克风开始录音"></icoder-stt>
    </div>
    <div>
      <h2>&lt;icoder-assistant&gt;</h2>
      <icoder-assistant language="zh-CN" mode="ambient"></icoder-assistant>
    </div>
  </div>

  <script type="module">
    import { iCoDerStt, iCoDerAssistant } from '../dist/icoder-stt.js';
    // If using npm: import '@icoder/web';

    // Configure with your credentials
    const config = {
      accessToken: '<your-access-token>',
      baseURL: 'http://localhost:8000',
    };

    document.querySelector('icoder-stt')?.configure(config);
    document.querySelector('icoder-assistant')?.configure(config);

    // Listen for transcript events
    document.querySelector('icoder-stt')?.addEventListener('transcript', (e) => {
      console.log('Transcript:', e.detail);
    });
  </script>
</body>
</html>
